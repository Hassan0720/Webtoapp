<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebToApp - Install Any Website as App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      max-width: 550px;
      width: 100%;
      background: rgba(20, 30, 45, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 30px;
      border: 1px solid rgba(100, 180, 250, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 28px; text-align: center; background: linear-gradient(90deg, #fff, #7bc9ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
    .sub { text-align: center; color: #8aa0c0; font-size: 14px; margin-bottom: 25px; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #c8ddff; font-size: 14px; }
    input, .file-area { width: 100%; padding: 14px 18px; background: #0f1425; border: 1px solid #2a3a55; border-radius: 60px; color: white; font-size: 16px; }
    input:focus { outline: none; border-color: #2d9eff; }
    .color-row { display: flex; gap: 12px; align-items: center; }
    #themeColor { width: 70px; height: 50px; border-radius: 30px; }
    .logo-preview { width: 70px; height: 70px; background: #0f1425; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 1px dashed #4a6a8f; overflow: hidden; }
    .logo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .file-row { display: flex; gap: 15px; align-items: center; }
    button { width: 100%; padding: 14px; background: linear-gradient(90deg, #1a6ed8, #0d47a1); border: none; border-radius: 60px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:active { transform: scale(0.97); }
    .install-area { margin-top: 25px; background: #0b1020cc; border-radius: 30px; padding: 18px; text-align: center; border: 1px solid #2d9eff40; display: none; }
    .install-btn { background: #00c853; margin-top: 12px; box-shadow: 0 4px 15px #00c85340; }
    .success-msg { color: #00e676; font-size: 13px; margin-top: 10px; }
    .info-note { margin-top: 20px; font-size: 12px; text-align: center; color: #6a7c9e; border-top: 1px solid #1f2a40; padding-top: 18px; }
    .badge { background: #1e2a44; display: inline-block; padding: 4px 12px; border-radius: 50px; font-size: 11px; margin-bottom: 15px; }
  </style>
</head>
<body>
<div class="card">
  <div style="text-align: center;"><span class="badge">⚡ POWERED BY PWA</span></div>
  <h1>📲 Website → App</h1>
  <div class="sub">कोई भी website बनाएं installable mobile app</div>
  <div class="input-group">
    <label>🌐 Website URL</label>
    <input type="text" id="urlInput" placeholder="https://amazon.in" value="https://google.com">
  </div>
  <div class="input-group">
    <label>✨ App Name</label>
    <input type="text" id="appNameInput" placeholder="My App" value="Google App">
  </div>
  <div class="input-group">
    <label>🎨 Theme Color</label>
    <div class="color-row">
      <input type="color" id="colorInput" value="#2d9eff">
      <span style="font-size: 13px;">Status bar color</span>
    </div>
  </div>
  <div class="input-group">
    <label>🖼️ App Icon (optional)</label>
    <div class="file-row">
      <input type="file" id="iconInput" accept="image/*" style="flex:1">
      <div class="logo-preview" id="iconPreview"><span>🚀</span></div>
    </div>
  </div>
  <button id="generateBtn">✨ Generate & Register App</button>
  <div id="installContainer" class="install-area">
    <div>✅ <strong id="appReadyMsg">App is ready</strong></div>
    <div style="font-size: 13px; margin-top: 5px;">👇 इंस्टॉल करें home screen पर</div>
    <button id="installBtn" class="install-btn">📲 Install App (APK जैसा)</button>
    <div id="installSuccessMsg" class="success-msg"></div>
  </div>
  <div class="info-note">
    💡 <strong>कैसे काम करता है?</strong><br>
    यह एक PWA बनाता है — बिलकुल असली app जैसा install होगा।<br>
    <strong>⚠️ ध्यान दें:</strong> GitHub Pages HTTPS पर है, तो पूरी तरह से काम करेगा!
  </div>
</div>

<script>
  let deferredPrompt = null;
  let currentSwUrl = null;
  const urlInput = document.getElementById('urlInput');
  const appNameInput = document.getElementById('appNameInput');
  const colorInput = document.getElementById('colorInput');
  const iconInput = document.getElementById('iconInput');
  const iconPreview = document.getElementById('iconPreview');
  const generateBtn = document.getElementById('generateBtn');
  const installContainer = document.getElementById('installContainer');
  const installBtn = document.getElementById('installBtn');
  const appReadyMsg = document.getElementById('appReadyMsg');
  let currentIconBase64 = null;

  iconInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        currentIconBase64 = ev.target.result;
        iconPreview.innerHTML = `<img src="${currentIconBase64}" alt="icon">`;
      };
      reader.readAsDataURL(e.target.files[0]);
    } else {
      currentIconBase64 = null;
      iconPreview.innerHTML = '<span>🚀</span>';
    }
  });

  async function createAndRegisterPWA() {
    let targetUrl = urlInput.value.trim();
    if (!targetUrl) { alert('Please enter a valid URL'); return false; }
    if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;
    const appName = appNameInput.value.trim() || "Web App";
    const themeClr = colorInput.value;

    let icons = [];
    if (currentIconBase64) {
      icons = [
        { src: currentIconBase64, sizes: "512x512", type: "image/png", purpose: "any maskable" },
        { src: currentIconBase64, sizes: "192x192", type: "image/png" }
      ];
    } else {
      const defaultIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%232d9eff'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='white'%3E🌐%3C/text%3E%3C/svg%3E";
      icons = [{ src: defaultIcon, sizes: "512x512", type: "image/svg+xml" }];
    }

    const manifest = {
      name: appName, short_name: appName.substring(0, 12), start_url: targetUrl,
      display: "standalone", background_color: "#0a0f1e", theme_color: themeClr,
      description: `Converted app - ${appName}`, icons: icons, orientation: "portrait", scope: "/"
    };

    const oldManifest = document.querySelector('link[rel="manifest"]');
    if (oldManifest) oldManifest.remove();
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest'; manifestLink.href = manifestUrl;
    document.head.appendChild(manifestLink);

    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (let reg of registrations) await reg.unregister();
      const swCode = `
        const CACHE_NAME = 'pwa-converter-v2';
        const START_URL = '${targetUrl}';
        self.addEventListener('install', event => {
          event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.add(START_URL).catch(() => {})));
          self.skipWaiting();
        });
        self.addEventListener('fetch', event => {
          if (event.request.mode === 'navigate') {
            event.respondWith(fetch(event.request).catch(() => caches.match(START_URL).then(res => res || new Response('<h2>Offline — please check internet</h2>', {headers: {'Content-Type': 'text/html'}}))));
          } else {
            event.respondWith(caches.match(event.request).then(res => res || fetch(event.request)));
          }
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      try { await navigator.serviceWorker.register(swUrl); } catch (err) { console.error(err); }
    }
    await new Promise(r => setTimeout(r, 500));
    installContainer.style.display = 'block';
    appReadyMsg.innerText = `✅ "${appName}" ready to install!`;
    return true;
  }

  generateBtn.addEventListener('click', async () => {
    generateBtn.innerText = '⏳ Generating...'; generateBtn.disabled = true;
    await createAndRegisterPWA();
    generateBtn.innerText = '✨ Generate & Register App'; generateBtn.disabled = false;
  });

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e; installContainer.style.display = 'block';
    appReadyMsg.innerText = '🎉 App is ready! Click install below.';
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') document.getElementById('installSuccessMsg').innerText = '✅ App installed! Check home screen.';
      deferredPrompt = null;
    } else alert('📱 Tap browser menu → "Add to Home screen" / "Install App"');
  });
  window.addEventListener('appinstalled', () => document.getElementById('installSuccessMsg').innerText = '🎉 Installed! Enjoy.');
</script>
</body>
</html>
